<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZERO//LINE — Buy Game</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="./gamebuy.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="buy-header">

        <a
            href="../index.html"
            class="buy-logo"
        >

            <span>
                ZERO
            </span>

            <span class="logo-slash">
                //
            </span>

            <span>
                LINE
            </span>

        </a>


        <nav class="buy-nav">

            <!-- <a href="../index.html#home">
                HOME
            </a>

            <a href="../index.html#updates">
                NEWS
            </a>

            <a href="../index.html#heroes">
                HEROES
            </a>

            <a
                href="../index.html#store"
                class="active"
            >
                STORE
            </a>

            <a href="../index.html#about">
                ABOUT
            </a> -->

        </nav>


        <a
            href="../index.html#store"
            class="back-store"
        >
            ← STORE
        </a>

    </header>



    <!-- ==================================================
         BUY HERO
    =================================================== -->

    <main class="buy-page">


        <!-- Background Image -->

        <img
            src="https://ik.imagekit.io/utopia0426/ZERO-LINE/ChatGPT%20Image%205%20Oct%202026,%2020_55_06.png?tr=w-1000,q-85,f-auto"
            alt="NOVA, VESPER and RONIN"
            class="buy-background"
        >


        <!-- Overlays -->

        <div class="buy-overlay"></div>

        <div class="buy-vignette"></div>



        <!-- ==================================================
             WORLD INFO
        =================================================== -->

        <div class="buy-side-info">

            <span class="side-index">
                01
            </span>

            <div class="side-line"></div>

            <span>
                GAME ACCESS
            </span>

            <p>
                HUMANITY
                <br>
                BEYOND
                <br>
                THE
                <br>
                ZERO LINE
            </p>

        </div>



        <!-- ==================================================
             CENTER CONTENT
        =================================================== -->

        <section class="buy-content">


            <div class="buy-game-title">

                <span class="project-label">
                    PROJECT
                </span>

                <h1>

                    ZERO

                    <span>
                        //
                    </span>

                    LINE

                </h1>

                <p>
                    HUMANITY BEYOND THE ZERO LINE
                </p>

            </div>



            <!-- BUY NOW -->

            <button
                class="buy-now-button"
                id="buyNowButton"
                type="button"
            >

                <span>
                    BUY NOW
                </span>

                <span class="buy-arrow">
                    →
                </span>

            </button>


            <div class="availability">

                <span></span>

                AVAILABLE ON PC & CONSOLE

                <span></span>

            </div>


        </section>



        <!-- ==================================================
             BOTTOM META
        =================================================== -->

        <div class="buy-bottom-meta">

            <span>
                © 2026 ZERO//LINE
            </span>

            <span>
                GLOBAL RELEASE
            </span>

            <span>
                ONLINE MULTIPLAYER
            </span>

        </div>


    </main>



    <!-- ==================================================
         PLATFORM MODAL
    =================================================== -->

    <div
        class="platform-modal"
        id="platformModal"
        aria-hidden="true"
    >

        <div
            class="platform-backdrop"
            id="platformBackdrop"
        ></div>


        <div class="platform-panel">


            <!-- HEADER -->

            <div class="platform-header">

                <div>

                    <span class="platform-eyebrow">
                        PURCHASE ZERO//LINE
                    </span>

                    <h2>
                        CHOOSE PLATFORM
                    </h2>

                </div>


                <button
                    class="platform-close"
                    id="platformClose"
                    type="button"
                    aria-label="Close platform selection"
                >
                    ×
                </button>

            </div>



            <!-- PLATFORM OPTIONS -->

            <div class="platform-grid">


                <!-- STEAM -->

                <button
                    class="platform-card"
                    type="button"
                >

                    <span class="platform-number">
                        01
                    </span>

                    <div>

                        <strong>
                            STEAM
                        </strong>

                        <span>
                            WINDOWS PC
                        </span>

                    </div>

                    <span class="platform-arrow">
                        →
                    </span>

                </button>



                <!-- EPIC -->

                <button
                    class="platform-card"
                    type="button"
                >

                    <span class="platform-number">
                        02
                    </span>

                    <div>

                        <strong>
                            EPIC GAMES
                        </strong>

                        <span>
                            WINDOWS PC
                        </span>

                    </div>

                    <span class="platform-arrow">
                        →
                    </span>

                </button>



                <!-- PS5 -->

                <button
                    class="platform-card"
                    type="button"
                >

                    <span class="platform-number">
                        03
                    </span>

                    <div>

                        <strong>
                            PLAYSTATION 5
                        </strong>

                        <span>
                            CONSOLE
                        </span>

                    </div>

                    <span class="platform-arrow">
                        →
                    </span>

                </button>



                <!-- XBOX -->

                <button
                    class="platform-card"
                    type="button"
                >

                    <span class="platform-number">
                        04
                    </span>

                    <div>

                        <strong>
                            XBOX SERIES
                        </strong>

                        <span>
                            CONSOLE
                        </span>

                    </div>

                    <span class="platform-arrow">
                        →
                    </span>

                </button>


            </div>


            <p class="platform-note">
                SELECT A PLATFORM TO CONTINUE TO THE OFFICIAL STORE.
            </p>


        </div>

    </div>



    <script src="./gamebuy.js"></script>

</body>

</html>
